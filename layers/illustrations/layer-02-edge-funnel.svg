<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'JetBrains Mono', ui-monospace, monospace">
<style>text{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;}</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eaef" stroke-width="0.5"/></pattern>
  <marker id="ar-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#dc2626"/></marker>
  <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/></marker>
  <marker id="ar-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#16a34a"/></marker>
  <linearGradient id="fun" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(217,119,6,0.16)"/><stop offset="1" stop-color="rgba(217,119,6,0.05)"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="#ffffff"/>
<rect width="1600" height="900" fill="url(#grid)"/>
<text x="60" y="56" fill="#8b92a5" font-size="16" letter-spacing="6" font-weight="600">GEN0SEC · ARCHITECTURE</text>
<rect x="60" y="100" width="68" height="68" rx="10" fill="#d97706"/>
<text x="94" y="144" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">02</text>
<text x="148" y="124" fill="#d97706" font-size="14" letter-spacing="4" font-weight="600">LAYER 02 · FORWARD DEFENSIVE BELT</text>
<text x="148" y="158" fill="#1a1d23" font-size="32" font-weight="700">The edge sheds; it does not analyse.</text>
<text x="148" y="190" fill="#5a6178" font-size="16">Cheap, wire-speed filters bleed off the obvious before the deep layers ever pay for it.</text>
<text x="800" y="248" fill="#8b92a5" font-size="13" letter-spacing="2" text-anchor="middle">WIRE-SPEED · NO DECRYPTION · STATELESS WHERE POSSIBLE</text>
<polygon points="320,300 1280,460 1280,500 320,660" fill="url(#fun)" stroke="#d97706" stroke-width="1.6"/>
<line x1="460" y1="323.3" x2="460" y2="636.7" stroke="#d97706" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
<line x1="390" y1="307.7" x2="390" y2="288" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.6"/>
<text x="390" y="276" fill="#d97706" font-size="12.5" font-weight="700" text-anchor="middle">Volumetric</text>
<text x="390" y="290" fill="#5a6178" font-size="10.5" text-anchor="middle">DDoS scrubbing</text>
<line x1="390" y1="652.3" x2="390" y2="704.3" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="390" y="722.3" fill="#dc2626" font-size="10.5" text-anchor="middle">drop: floods · amplification</text>
<line x1="660" y1="356.7" x2="660" y2="603.3" stroke="#d97706" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
<line x1="560" y1="336.0" x2="560" y2="288" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.6"/>
<text x="560" y="276" fill="#d97706" font-size="12.5" font-weight="700" text-anchor="middle">Reputation &amp; geo</text>
<text x="560" y="290" fill="#5a6178" font-size="10.5" text-anchor="middle">Layer 01 IOCs</text>
<line x1="560" y1="624.0" x2="560" y2="676.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="560" y="694.0" fill="#dc2626" font-size="10.5" text-anchor="middle">drop: known-bad IPs · regions</text>
<line x1="860" y1="390.0" x2="860" y2="570.0" stroke="#d97706" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
<line x1="760" y1="369.3" x2="760" y2="288" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.6"/>
<text x="760" y="276" fill="#d97706" font-size="12.5" font-weight="700" text-anchor="middle">JA4+ fingerprint</text>
<text x="760" y="290" fill="#5a6178" font-size="10.5" text-anchor="middle">Amygdala · CTI</text>
<line x1="760" y1="590.7" x2="760" y2="642.7" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="760" y="660.7" fill="#dc2626" font-size="10.5" text-anchor="middle">drop: flagged stacks · bots</text>
<line x1="1060" y1="423.3" x2="1060" y2="536.7" stroke="#d97706" stroke-width="1" stroke-dasharray="5,5" opacity="0.6"/>
<line x1="960" y1="402.7" x2="960" y2="288" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.6"/>
<text x="960" y="276" fill="#d97706" font-size="12.5" font-weight="700" text-anchor="middle">Rate-limit</text>
<text x="960" y="290" fill="#5a6178" font-size="10.5" text-anchor="middle">per IP / ASN / cred</text>
<line x1="960" y1="557.3" x2="960" y2="609.3" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ar-red)"/>
<text x="960" y="627.3" fill="#dc2626" font-size="10.5" text-anchor="middle">drop: abuse · cred stuffing</text>
<line x1="1170" y1="437.7" x2="1170" y2="288" stroke="#d97706" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.6"/>
<text x="1170" y="276" fill="#d97706" font-size="12.5" font-weight="700" text-anchor="middle">Tag &amp; pass</text>
<line x1="150" y1="480" x2="314" y2="480" stroke="#d97706" stroke-width="7" marker-end="url(#ar-orange)" opacity="0.9"/>
<text x="175" y="462" fill="#1a1d23" font-size="13" font-weight="700">ALL INBOUND</text>
<text x="175" y="500" fill="#8b92a5" font-size="12">100% of traffic</text>
<line x1="1284" y1="480" x2="1372" y2="480" stroke="#16a34a" stroke-width="3" marker-end="url(#ar-green)"/>
<text x="1382" y="466" fill="#16a34a" font-size="13" font-weight="700">tag &amp; pass</text>
<text x="1382" y="486" fill="#5a6178" font-size="11">the thin survivor —</text>
<text x="1382" y="502" fill="#5a6178" font-size="11">enriched: JA4+,</text>
<text x="1382" y="518" fill="#5a6178" font-size="11">reputation, ASN</text>
<text x="1382" y="540" fill="#16a34a" font-size="12" font-weight="700">→ Layer 03</text>
<text x="345" y="485.0" fill="#d97706" font-size="13" font-weight="700">100%</text>
<text x="1180" y="476" fill="#d97706" font-size="11" font-weight="700">few %</text>
<line x1="60" y1="800" x2="1540" y2="800" stroke="#e8eaef" stroke-width="1"/>
<text x="60" y="840" fill="#d97706" font-size="12" letter-spacing="3" font-weight="700">DOCTRINE</text>
<text x="60" y="872" fill="#1a1d23" font-size="22" font-weight="500">Kill the cheap and obvious at the edge. Spend depth only on what survives.</text>
</svg>