<text x="1150" y="680" fill="#9333ea" font-size="11" font-weight="700" text-anchor="middle">FRESH · FULLY SUPPLIED · IN FORMATION</text>
<text x="1150" y="694" fill="#5a6178" font-size="10" text-anchor="middle">kept out of the daily fight — a strategic asset</text>
<path d="M 1040 450 C 900 380 800 410 760 500" fill="none" stroke="#9333ea" stroke-width="4" marker-end="url(#arr-purple)"/>
<path d="M 1060 480 C 940 430 850 460 800 535" fill="none" stroke="#9333ea" stroke-width="3" marker-end="url(#arr-purple)" opacity="0.8"/>
