<text x="94" y="144" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">04</text>
<text x="148" y="124" fill="#9333ea" font-size="14" letter-spacing="4" font-weight="600">LAYER 04 · RESERVES &amp; COUNTERATTACK — 1917</text>
<text x="148" y="158" fill="#1a1d23" font-size="32" font-weight="700">Held back, then committed in mass.</text>
<text x="148" y="190" fill="#5a6178" font-size="16">The Eingreifdivision waits in depth and strikes the exhausted penetration at the decisive moment.</text>
<text x="250" y="246" fill="#dc2626" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">SPENT ASSAULT</text>
<text x="760" y="246" fill="#16a34a" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">HAUPTKAMPFFELD · BENT, NOT BROKEN</text>
<text x="1380" y="246" fill="#9333ea" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">EINGREIF · RESERVES IN DEPTH</text>
