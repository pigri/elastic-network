<text x="905" y="384" fill="#9333ea" font-size="12" font-weight="700" text-anchor="middle">committed in mass · decisive moment</text>
<rect x="640" y="288" width="360" height="16" fill="#ffffff" opacity="0.92"/>
<text x="820" y="312" fill="#9333ea" font-size="12" font-weight="700" text-anchor="middle">timing &gt; strength — Layer 05 says when →</text>
<line x1="980" y1="318" x2="1100" y2="430" stroke="#9333ea" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.5"/>
<line x1="60" y1="780" x2="1540" y2="780" stroke="#e8eaef" stroke-width="1"/>
<text x="60" y="820" fill="#9333ea" font-size="12" letter-spacing="3" font-weight="700">DOCTRINE</text>
<text x="60" y="852" fill="#1a1d23" font-size="22" font-weight="500">Don't fight from the line. Reserves are committed in mass, or not at all — until the penetration is the wrong call.</text>
