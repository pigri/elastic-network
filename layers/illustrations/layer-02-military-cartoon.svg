<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'JetBrains Mono', ui-monospace, monospace">
  <style>text { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eaef" stroke-width="0.5"/></pattern>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="arr-redt" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#5a6178"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- HEADER -->
  <text x="60" y="56" fill="#8b92a5" font-size="16" letter-spacing="6" font-weight="600">GEN0SEC · DOCTRINE</text>
  <rect x="60" y="100" width="68" height="68" rx="10" fill="#d97706"/>
  <text x="94" y="144" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">02</text>
  <text x="148" y="124" fill="#d97706" font-size="14" letter-spacing="4" font-weight="600">LAYER 02 · FORWARD DEFENSIVE BELT — 1916</text>
  <text x="148" y="158" fill="#1a1d23" font-size="32" font-weight="700">The shock absorber, spent on purpose.</text>
  <text x="148" y="190" fill="#5a6178" font-size="16">How wire, machine guns, and pre-registered mortars slowed the assault instead of trying to hold it.</text>

  <!-- ZONE LABELS -->
  <text x="220" y="246" fill="#dc2626" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">ALLIED ASSAULT</text>
  <text x="800" y="246" fill="#d97706" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">VORFELDZONE · FORWARD DEFENSIVE BELT</text>
  <text x="1380" y="246" fill="#16a34a" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">MAIN LINE · HAUPTKAMPFFELD</text>

  <line x1="420" y1="260" x2="420" y2="720" stroke="#d5d9e0" stroke-width="1" stroke-dasharray="6,6"/>
  <line x1="1200" y1="260" x2="1200" y2="720" stroke="#d5d9e0" stroke-width="1" stroke-dasharray="6,6"/>
  <rect x="420" y="260" width="780" height="460" rx="6" fill="rgba(217,119,6,0.05)"/>

  <!-- GROUND -->
  <line x1="40" y1="600" x2="1560" y2="600" stroke="#1a1d23" stroke-width="2"/>
  <g fill="#8b92a5" opacity="0.4">
    <circle cx="100" cy="645" r="1"/><circle cx="220" cy="660" r="1"/><circle cx="340" cy="650" r="1"/><circle cx="460" cy="665" r="1"/><circle cx="580" cy="650" r="1"/><circle cx="700" cy="662" r="1"/><circle cx="820" cy="652" r="1"/><circle cx="940" cy="666" r="1"/><circle cx="1060" cy="654" r="1"/><circle cx="1180" cy="662" r="1"/><circle cx="1300" cy="652" r="1"/><circle cx="1420" cy="664" r="1"/><circle cx="1520" cy="656" r="1"/>
  </g>

  <!-- ATTACKER ZONE -->
  <line x1="60" y1="430" x2="410" y2="430" stroke="#dc2626" stroke-width="6" marker-end="url(#arr-red)" opacity="0.9"/>
  <text x="235" y="418" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">FULL-STRENGTH ASSAULT</text>
  <g stroke="#dc2626" stroke-width="2" fill="#dc2626">
    <g transform="translate(250,600)"><circle cx="0" cy="-30" r="5"/><line x1="0" y1="-25" x2="0" y2="-10"/><line x1="0" y1="-20" x2="-9" y2="-12"/><line x1="0" y1="-20" x2="11" y2="-15"/><line x1="11" y1="-15" x2="20" y2="-22"/><line x1="0" y1="-10" x2="-7" y2="2"/><line x1="0" y1="-10" x2="7" y2="2"/></g>
    <g transform="translate(310,600)"><circle cx="0" cy="-30" r="5"/><line x1="0" y1="-25" x2="0" y2="-10"/><line x1="0" y1="-20" x2="-9" y2="-13"/><line x1="0" y1="-20" x2="11" y2="-15"/><line x1="11" y1="-15" x2="22" y2="-12"/><line x1="0" y1="-10" x2="-7" y2="2"/><line x1="0" y1="-10" x2="7" y2="2"/></g>
    <g transform="translate(370,600)"><circle cx="0" cy="-30" r="5"/><line x1="0" y1="-25" x2="0" y2="-10"/><line x1="0" y1="-20" x2="-9" y2="-12"/><line x1="0" y1="-20" x2="11" y2="-15"/><line x1="11" y1="-15" x2="20" y2="-19"/><line x1="0" y1="-10" x2="-7" y2="2"/><line x1="0" y1="-10" x2="7" y2="2"/></g>
  </g>
  <text x="310" y="560" fill="#dc2626" font-size="10" text-anchor="middle">assault waves</text>
  <path d="M 50 605 L 70 622 L 90 605 L 110 622 L 130 605 L 150 622 L 170 605 L 190 622 L 210 605 L 230 622 L 250 605 L 270 622 L 290 605 L 310 622 L 330 605 L 350 622 L 370 605 L 390 622 L 410 605" fill="none" stroke="#dc2626" stroke-width="2"/>

  <!-- BELT: wire entanglement -->
  <g stroke="#d97706" stroke-width="2">
    <line x1="450" y1="585" x2="560" y2="585"/><line x1="450" y1="600" x2="560" y2="600"/>
    <line x1="455" y1="585" x2="470" y2="600"/><line x1="470" y1="585" x2="455" y2="600"/>
    <line x1="490" y1="585" x2="505" y2="600"/><line x1="505" y1="585" x2="490" y2="600"/>
    <line x1="525" y1="585" x2="540" y2="600"/><line x1="540" y1="585" x2="525" y2="600"/>
  </g>
  <rect x="466" y="610" width="80" height="30" fill="#ffffff" opacity="0.92"/>
  <text x="506" y="624" fill="#d97706" font-size="11" font-weight="700" text-anchor="middle">WIRE</text>
  <text x="506" y="637" fill="#5a6178" font-size="10" text-anchor="middle">entanglement</text>

  <!-- BELT: Minenwerfer (mortar) + pre-registered TRP -->
  <g transform="translate(690,600)" stroke="#d97706" stroke-width="2" fill="none"><circle cx="0" cy="-8" r="8"/><line x1="0" y1="-12" x2="0" y2="-28"/></g>
  <path d="M 688 572 Q 632 486 600 596" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>
  <g stroke="#d97706" stroke-width="2" fill="none"><circle cx="600" cy="600" r="9"/><line x1="600" y1="588" x2="600" y2="612"/><line x1="588" y1="600" x2="612" y2="600"/></g>
  <rect x="640" y="548" width="100" height="16" fill="#ffffff" opacity="0.92"/>
  <text x="690" y="560" fill="#d97706" font-size="11" font-weight="700" text-anchor="middle">MINENWERFER</text>
  <rect x="554" y="624" width="94" height="16" fill="#ffffff" opacity="0.92"/>
  <text x="601" y="636" fill="#5a6178" font-size="10" text-anchor="middle">pre-registered TRP</text>

  <!-- BELT: MG nests (staggered, ground level) -->
  <g transform="translate(800,600)" stroke="#d97706" stroke-width="2" fill="none"><rect x="-13" y="-24" width="26" height="13" fill="rgba(217,119,6,0.10)"/><line x1="0" y1="-18" x2="22" y2="-18" stroke-width="3"/></g>
  <g transform="translate(884,600)" stroke="#d97706" stroke-width="2" fill="none"><rect x="-13" y="-30" width="26" height="13" fill="rgba(217,119,6,0.10)"/><line x1="0" y1="-24" x2="22" y2="-24" stroke-width="3"/></g>
  <rect x="786" y="640" width="174" height="30" fill="#ffffff" opacity="0.92"/>
  <text x="842" y="652" fill="#d97706" font-size="11" font-weight="700" text-anchor="middle">MG NESTS</text>
  <text x="842" y="665" fill="#5a6178" font-size="10" text-anchor="middle">staggered, interlocking</text>

  <!-- BELT: minefield -->
  <g fill="rgba(217,119,6,0.18)" stroke="#d97706" stroke-width="1.4">
    <path d="M 950 600 l 7 -12 l 7 12 z"/><path d="M 978 600 l 7 -12 l 7 12 z"/><path d="M 1006 600 l 7 -12 l 7 12 z"/>
  </g>
  <rect x="922" y="624" width="164" height="16" fill="#ffffff" opacity="0.92"/>
  <text x="1004" y="636" fill="#d97706" font-size="10" text-anchor="middle">minefield — canalises</text>

  <!-- KILLING GROUND funnel -->
  <polygon points="1040,300 1175,475 1175,525 1040,700" fill="rgba(220,38,38,0.07)" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,4"/>
  <g stroke="#dc2626" stroke-width="1.4" opacity="0.8"><line x1="1150" y1="486" x2="1170" y2="514"/><line x1="1170" y1="486" x2="1150" y2="514"/><circle cx="1160" cy="500" r="10" fill="none"/></g>
  <text x="1100" y="336" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">KILLING GROUND</text>
  <text x="1100" y="350" fill="#5a6178" font-size="10" text-anchor="middle">concentrated fire on our axis</text>

  <!-- ATTRITION arrows: wide in, channeled, one thin out -->
  <text x="800" y="392" fill="#dc2626" font-size="12" font-weight="700" text-anchor="middle">ATTACK BLEEDS &amp; CHANNELS →</text>
  <path d="M 430 420 C 700 420 900 470 1035 492" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7,5" opacity="0.7"/>
  <path d="M 430 500 C 700 500 900 500 1035 500" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7,5" opacity="0.7"/>
  <path d="M 430 560 C 700 560 900 530 1035 508" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7,5" opacity="0.7"/>
  <!-- stopped at obstacles -->
  <g stroke="#dc2626" stroke-width="2.2" opacity="0.9"><line x1="560" y1="446" x2="576" y2="462"/><line x1="576" y1="446" x2="560" y2="462"/><line x1="812" y1="520" x2="828" y2="536"/><line x1="828" y1="520" x2="812" y2="536"/></g>
  <!-- thin survivor out -->
  <line x1="1178" y1="500" x2="1245" y2="500" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arr-redt)"/>
  <text x="1210" y="488" fill="#dc2626" font-size="10" text-anchor="middle">weaker · later</text>

  <!-- MAIN LINE -->
  <g stroke="#16a34a" stroke-width="2.5" fill="none">
    <path d="M 1220 605 L 1245 622 L 1270 605 L 1295 622 L 1320 605 L 1345 622 L 1370 605 L 1395 622 L 1420 605 L 1445 622 L 1470 605 L 1495 622 L 1520 605 L 1545 622 L 1560 610"/>
    <path d="M 1220 660 L 1245 678 L 1270 660 L 1295 678 L 1320 660 L 1345 678 L 1370 660 L 1395 678 L 1420 660 L 1445 678 L 1470 660 L 1495 678 L 1520 660 L 1545 678 L 1560 666"/>
  </g>
  <g transform="translate(1330,600)" stroke="#16a34a" stroke-width="2" fill="none"><rect x="-12" y="-26" width="24" height="14" fill="rgba(22,163,74,0.10)"/><line x1="0" y1="-19" x2="22" y2="-19" stroke-width="3"/></g>
  <text x="1330" y="568" fill="#16a34a" font-size="10" font-weight="700" text-anchor="middle">MG nest</text>
  <g stroke="#16a34a" stroke-width="2" fill="#16a34a">
    <g transform="translate(1255,600)"><circle cx="0" cy="-22" r="4"/><line x1="0" y1="-18" x2="0" y2="-8"/><line x1="0" y1="-14" x2="-6" y2="-10"/><line x1="0" y1="-14" x2="6" y2="-10"/></g>
    <g transform="translate(1450,600)"><circle cx="0" cy="-22" r="4"/><line x1="0" y1="-18" x2="0" y2="-8"/><line x1="0" y1="-14" x2="-6" y2="-10"/><line x1="0" y1="-14" x2="6" y2="-10"/></g>
  </g>
  <text x="1450" y="450" fill="#5a6178" font-size="11" text-anchor="middle">layer 03</text>
  <text x="1450" y="464" fill="#5a6178" font-size="11" text-anchor="middle">deeper behind →</text>
  <line x1="1410" y1="478" x2="1540" y2="478" stroke="#5a6178" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-gray)" opacity="0.7"/>

  <!-- FOOTER -->
  <line x1="60" y1="780" x2="1540" y2="780" stroke="#e8eaef" stroke-width="1"/>
  <text x="60" y="820" fill="#d97706" font-size="12" letter-spacing="3" font-weight="700">DOCTRINE</text>
  <text x="60" y="852" fill="#1a1d23" font-size="22" font-weight="500">Spend the belt, do not hold it. The attacker must arrive later, weaker, and on the axis you chose.</text>
</svg>