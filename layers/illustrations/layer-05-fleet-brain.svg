<text x="94" y="144" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">05</text>
<text x="148" y="124" fill="#16a34a" font-size="14" letter-spacing="4" font-weight="600">LAYER 05 · INTELLIGENCE &amp; ADAPTATION</text>
<text x="148" y="158" fill="#1a1d23" font-size="32" font-weight="700">One brain, the whole front.</text>
<text x="148" y="190" fill="#5a6178" font-size="16">Learn from every sensor at once; push the lesson to every sensor at once.</text>
