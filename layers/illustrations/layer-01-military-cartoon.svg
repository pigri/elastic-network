<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'JetBrains Mono', ui-monospace, monospace">
  <style>text { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eaef" stroke-width="0.5"/>
    </pattern>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arr-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- ────────────────────── HEADER ────────────────────── -->
  <text x="60" y="56" fill="#8b92a5" font-size="16" letter-spacing="6" font-family="Orbitron, 'JetBrains Mono', monospace" font-weight="600">GEN0SEC · DOCTRINE</text>

  <rect x="60" y="100" width="68" height="68" rx="10" fill="#0891b2"/>
  <text x="94" y="144" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle">01</text>

  <text x="148" y="124" fill="#0891b2" font-size="14" letter-spacing="4" font-weight="600">LAYER 01 · OUTPOST LINE — 1916</text>
  <text x="148" y="158" fill="#1a1d23" font-size="32" font-weight="700">The forward zone, in plain sight.</text>
  <text x="148" y="190" fill="#5a6178" font-size="16">How outposts, cavalry vedettes, and Scheinstellungen converted future combat into present knowledge.</text>

  <!-- ────────────────────── ZONE LABELS ────────────────────── -->
  <text x="220" y="246" fill="#dc2626" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">ALLIED ATTACKER</text>
  <text x="800" y="246" fill="#0891b2" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">VORPOSTENZONE · FORWARD OBSERVATION ZONE</text>
  <text x="1380" y="246" fill="#16a34a" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">MAIN LINE · HAUPTKAMPFFELD</text>

  <!-- Vertical separators -->
  <line x1="420" y1="260" x2="420" y2="720" stroke="#d5d9e0" stroke-width="1" stroke-dasharray="6,6"/>
  <line x1="1200" y1="260" x2="1200" y2="720" stroke="#d5d9e0" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- Forward zone tint -->
  <rect x="420" y="260" width="780" height="460" rx="6" fill="rgba(8,145,178,0.04)"/>

  <!-- ────────────────────── GROUND LINE ────────────────────── -->
  <line x1="40" y1="600" x2="1560" y2="600" stroke="#1a1d23" stroke-width="2"/>

  <!-- Subterranean dotted texture -->
  <g fill="#8b92a5" opacity="0.4">
    <circle cx="100" cy="640" r="1"/><circle cx="180" cy="660" r="1"/><circle cx="240" cy="650" r="1"/>
    <circle cx="320" cy="670" r="1"/><circle cx="380" cy="655" r="1"/><circle cx="460" cy="665" r="1"/>
    <circle cx="540" cy="650" r="1"/><circle cx="620" cy="660" r="1"/><circle cx="700" cy="655" r="1"/>
    <circle cx="780" cy="670" r="1"/><circle cx="860" cy="660" r="1"/><circle cx="940" cy="650" r="1"/>
    <circle cx="1020" cy="665" r="1"/><circle cx="1100" cy="655" r="1"/><circle cx="1180" cy="670" r="1"/>
    <circle cx="1260" cy="660" r="1"/><circle cx="1340" cy="650" r="1"/><circle cx="1420" cy="665" r="1"/>
    <circle cx="1500" cy="660" r="1"/>
  </g>

  <!-- ════════════════════ ATTACKER ZONE ════════════════════ -->

  <!-- Aerial observation balloon -->
  <g stroke="#dc2626" stroke-width="1.5" fill="none">
    <ellipse cx="100" cy="310" rx="36" ry="20" fill="rgba(220,38,38,0.08)"/>
    <line x1="100" y1="330" x2="100" y2="378"/>
    <rect x="92" y="378" width="16" height="12" fill="#ffffff"/>
  </g>
  <text x="100" y="408" fill="#dc2626" font-size="11" text-anchor="middle">aerial recon</text>
  <text x="100" y="422" fill="#5a6178" font-size="10" text-anchor="middle">(kite balloon)</text>

  <!-- Field gun -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <circle cx="200" cy="580" r="10" fill="#ffffff"/>
    <circle cx="200" cy="580" r="3" fill="#dc2626"/>
    <line x1="200" y1="575" x2="230" y2="555"/>
    <line x1="200" y1="580" x2="185" y2="595"/>
  </g>
  <text x="200" y="555" fill="#dc2626" font-size="10" text-anchor="middle">artillery</text>

  <!-- Infantry stick figures, advancing right -->
  <g stroke="#dc2626" stroke-width="2" fill="#dc2626">
    <!-- soldier 1 -->
    <g transform="translate(280, 600)">
      <circle cx="0" cy="-30" r="5"/>
      <line x1="0" y1="-25" x2="0" y2="-10"/>
      <line x1="0" y1="-20" x2="-9" y2="-12"/>
      <line x1="0" y1="-20" x2="11" y2="-15" stroke-width="2"/>
      <line x1="11" y1="-15" x2="20" y2="-22" stroke-width="2"/>
      <line x1="0" y1="-10" x2="-7" y2="2"/>
      <line x1="0" y1="-10" x2="7" y2="2"/>
    </g>
    <!-- soldier 2 -->
    <g transform="translate(340, 600)">
      <circle cx="0" cy="-30" r="5"/>
      <line x1="0" y1="-25" x2="0" y2="-10"/>
      <line x1="0" y1="-20" x2="-9" y2="-13"/>
      <line x1="0" y1="-20" x2="11" y2="-15" stroke-width="2"/>
      <line x1="11" y1="-15" x2="22" y2="-12" stroke-width="2"/>
      <line x1="0" y1="-10" x2="-7" y2="2"/>
      <line x1="0" y1="-10" x2="7" y2="2"/>
    </g>
  </g>
  <text x="310" y="560" fill="#dc2626" font-size="10" text-anchor="middle">infantry</text>

  <!-- Attacker trench (zigzag) -->
  <path d="M 50 605 L 70 622 L 90 605 L 110 622 L 130 605 L 150 622 L 170 605 L 190 622 L 210 605 L 230 622 L 250 605 L 270 622 L 290 605 L 310 622 L 330 605 L 350 622 L 370 605 L 390 622 L 410 605"
        fill="none" stroke="#dc2626" stroke-width="2"/>

  <!-- Attack momentum arrow -->
  <line x1="60" y1="450" x2="410" y2="450" stroke="#dc2626" stroke-width="3" marker-end="url(#arr-red)" opacity="0.85"/>
  <text x="235" y="442" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">ATTACK MOMENTUM</text>

  <!-- ════════════════════ FORWARD ZONE ════════════════════ -->

  <!-- (1) Real outpost — light trench, small unit -->
  <g transform="translate(480, 0)">
    <!-- Trench segment -->
    <path d="M 0 605 L 18 620 L 36 605 L 54 620 L 72 605" fill="none" stroke="#1a1d23" stroke-width="2"/>
    <!-- Soldier in trench (Lauschposten / observer) -->
    <g stroke="#1a1d23" stroke-width="2" fill="#1a1d23">
      <circle cx="36" cy="595" r="4"/>
      <line x1="36" y1="591" x2="36" y2="605"/>
    </g>
  </g>
  <text x="516" y="540" fill="#1a1d23" font-size="11" font-weight="700" text-anchor="middle">OUTPOST</text>
  <text x="516" y="554" fill="#5a6178" font-size="10" text-anchor="middle">(light, expendable)</text>

  <!-- (2) Cavalry vedette -->
  <g transform="translate(680, 600)">
    <!-- Horse body -->
    <ellipse cx="0" cy="-14" rx="22" ry="9" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
    <!-- Horse head + ear -->
    <ellipse cx="20" cy="-22" rx="7" ry="5" fill="#ffffff" stroke="#1a1d23" stroke-width="1.5"/>
    <line x1="23" y1="-26" x2="26" y2="-31" stroke="#1a1d23" stroke-width="1.5"/>
    <!-- Tail -->
    <line x1="-22" y1="-14" x2="-30" y2="-10" stroke="#1a1d23" stroke-width="1.5"/>
    <!-- Legs -->
    <line x1="-16" y1="-7" x2="-16" y2="0" stroke="#1a1d23" stroke-width="1.5"/>
    <line x1="-6" y1="-7" x2="-6" y2="0" stroke="#1a1d23" stroke-width="1.5"/>
    <line x1="6" y1="-7" x2="6" y2="0" stroke="#1a1d23" stroke-width="1.5"/>
    <line x1="16" y1="-7" x2="16" y2="0" stroke="#1a1d23" stroke-width="1.5"/>
    <!-- Rider -->
    <g stroke="#1a1d23" stroke-width="2" fill="#1a1d23">
      <circle cx="-3" cy="-36" r="4"/>
      <line x1="-3" y1="-32" x2="-3" y2="-20"/>
      <line x1="-3" y1="-28" x2="-11" y2="-22"/>
      <line x1="-3" y1="-28" x2="6" y2="-22"/>
    </g>
  </g>
  <text x="680" y="540" fill="#1a1d23" font-size="11" font-weight="700" text-anchor="middle">VEDETTE</text>
  <text x="680" y="554" fill="#5a6178" font-size="10" text-anchor="middle">(passive observer)</text>

  <!-- (3) Listening Post / Lauschposten -->
  <g transform="translate(840, 0)">
    <!-- Dugout (half-circle below ground) -->
    <path d="M 0 600 A 20 20 0 0 0 40 600" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="2"/>
    <!-- Observer head poking up -->
    <circle cx="20" cy="600" r="4" fill="#0891b2" stroke="#0891b2"/>
    <!-- Sound wave arcs -->
    <path d="M 50 590 A 14 14 0 0 1 50 614" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.6"/>
    <path d="M 60 585 A 22 22 0 0 1 60 619" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.4"/>
    <path d="M 70 580 A 30 30 0 0 1 70 624" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.25"/>
  </g>
  <text x="860" y="540" fill="#0891b2" font-size="11" font-weight="700" text-anchor="middle">LP / OP</text>
  <text x="860" y="554" fill="#5a6178" font-size="10" text-anchor="middle">Lauschposten</text>

  <!-- (4) Scheinstellung — dummy trench -->
  <g transform="translate(950, 0)">
    <path d="M 0 605 L 18 620 L 36 605 L 54 620 L 72 605 L 90 620 L 108 605 L 126 620 L 144 605"
          fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Straw dummy figures (X-head stick figures) -->
    <g stroke="#0891b2" stroke-width="1.5" fill="none">
      <g transform="translate(40, 595)">
        <line x1="-4" y1="-8" x2="4" y2="0"/>
        <line x1="4" y1="-8" x2="-4" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="12"/>
        <line x1="0" y1="4" x2="-6" y2="8"/>
        <line x1="0" y1="4" x2="6" y2="8"/>
      </g>
      <g transform="translate(96, 595)">
        <line x1="-4" y1="-8" x2="4" y2="0"/>
        <line x1="4" y1="-8" x2="-4" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="12"/>
        <line x1="0" y1="4" x2="-6" y2="8"/>
        <line x1="0" y1="4" x2="6" y2="8"/>
      </g>
    </g>
  </g>
  <text x="1022" y="512" fill="#0891b2" font-size="11" font-weight="700" text-anchor="middle">SCHEINSTELLUNG</text>
  <text x="1022" y="526" fill="#5a6178" font-size="10" text-anchor="middle">dummy trench</text>
  <text x="1022" y="540" fill="#5a6178" font-size="10" text-anchor="middle">+ straw crew</text>

  <!-- (5) Scheinbatterie — wooden gun (shifted right to clear Scheinstellung label) -->
  <g transform="translate(1160, 0)">
    <g stroke="#0891b2" stroke-width="2" fill="none" stroke-dasharray="5,3">
      <circle cx="0" cy="590" r="10"/>
      <line x1="0" y1="585" x2="30" y2="565"/>
      <line x1="0" y1="590" x2="-15" y2="605"/>
    </g>
    <text x="35" y="568" fill="#0891b2" font-size="9" font-style="italic">[wood]</text>
  </g>
  <text x="1160" y="512" fill="#0891b2" font-size="11" font-weight="700" text-anchor="middle">SCHEINBATTERIE</text>
  <text x="1160" y="526" fill="#5a6178" font-size="10" text-anchor="middle">wooden guns</text>
  <text x="1160" y="540" fill="#5a6178" font-size="10" text-anchor="middle">to draw fire</text>

  <!-- Intel collector rail: each forward element drops a stub into a single channel
       that carries the intelligence right, into the main line. -->
  <!-- Vertical feeder stubs (no heads) -->
  <g stroke="#0891b2" stroke-width="1.5" opacity="0.55">
    <line x1="516" y1="624" x2="516" y2="662"/>
    <line x1="680" y1="606" x2="680" y2="662"/>
    <line x1="860" y1="616" x2="860" y2="662"/>
    <line x1="1022" y1="624" x2="1022" y2="662"/>
    <line x1="1160" y1="606" x2="1160" y2="662"/>
  </g>
  <!-- Horizontal channel -->
  <line x1="512" y1="662" x2="1205" y2="662" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
  <!-- Channel into the main line (single arrow, matching head) -->
  <line x1="1205" y1="662" x2="1245" y2="662" stroke="#0891b2" stroke-width="2" marker-end="url(#arr-cyan)"/>
  <text x="840" y="690" fill="#0891b2" font-size="12" font-weight="600" text-anchor="middle">INTELLIGENCE CHANNEL · warning · counter-battery data · fingerprints →</text>

  <!-- ════════════════════ MAIN LINE ════════════════════ -->

  <!-- Heavy double trench system -->
  <g stroke="#16a34a" stroke-width="2.5" fill="rgba(22,163,74,0.06)">
    <path d="M 1220 605 L 1245 622 L 1270 605 L 1295 622 L 1320 605 L 1345 622 L 1370 605 L 1395 622 L 1420 605 L 1445 622 L 1470 605 L 1495 622 L 1520 605 L 1545 622 L 1560 610"
          fill="none"/>
    <path d="M 1220 660 L 1245 678 L 1270 660 L 1295 678 L 1320 660 L 1345 678 L 1370 660 L 1395 678 L 1420 660 L 1445 678 L 1470 660 L 1495 678 L 1520 660 L 1545 678 L 1560 666"
          fill="none"/>
  </g>

  <!-- Machine gun nest on main line -->
  <g transform="translate(1320, 600)" stroke="#16a34a" stroke-width="2" fill="none">
    <rect x="-12" y="-26" width="24" height="14" fill="rgba(22,163,74,0.10)"/>
    <line x1="0" y1="-19" x2="22" y2="-19" stroke-width="3"/>
  </g>
  <text x="1320" y="568" fill="#16a34a" font-size="10" font-weight="700" text-anchor="middle">MG nest</text>

  <!-- Defender figures -->
  <g stroke="#16a34a" stroke-width="2" fill="#16a34a">
    <g transform="translate(1250, 600)">
      <circle cx="0" cy="-22" r="4"/>
      <line x1="0" y1="-18" x2="0" y2="-8"/>
      <line x1="0" y1="-14" x2="-6" y2="-10"/>
      <line x1="0" y1="-14" x2="6" y2="-10"/>
    </g>
    <g transform="translate(1430, 600)">
      <circle cx="0" cy="-22" r="4"/>
      <line x1="0" y1="-18" x2="0" y2="-8"/>
      <line x1="0" y1="-14" x2="-6" y2="-10"/>
      <line x1="0" y1="-14" x2="6" y2="-10"/>
    </g>
  </g>

  <!-- Layer 03 hint (gray line + gray head, matched) -->
  <text x="1450" y="450" fill="#5a6178" font-size="11" text-anchor="middle">layers 02 / 03</text>
  <text x="1450" y="464" fill="#5a6178" font-size="11" text-anchor="middle">deeper behind →</text>
  <line x1="1410" y1="478" x2="1540" y2="478" stroke="#5a6178" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-gray)" opacity="0.7"/>

  <!-- ════════════════════ FOOTER ════════════════════ -->
  <line x1="60" y1="780" x2="1540" y2="780" stroke="#e8eaef" stroke-width="1"/>
  <text x="60" y="820" fill="#0891b2" font-size="12" letter-spacing="3" font-weight="700">DOCTRINE</text>
  <text x="60" y="852" fill="#1a1d23" font-size="22" font-weight="500" letter-spacing="-0.01em">Trade ground for information. The outpost generates it passively. The Scheinstellung provokes it.</text>
</svg>
