<text x="148" y="124" fill="#16a34a" font-size="14" letter-spacing="4" font-weight="600">LAYER 05 · INTELLIGENCE &amp; ADAPTATION — 1916</text>
<text x="148" y="158" fill="#1a1d23" font-size="32" font-weight="700">The staff that rewrites the doctrine.</text>
<text x="148" y="190" fill="#5a6178" font-size="16">Correlate every source, predict the next Schwerpunkt, and revise the doctrine before the next battle.</text>
