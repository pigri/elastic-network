<text x="700" y="612" fill="#5a6178" font-size="12" font-weight="700" text-anchor="middle">Cambrai 1917: absorbed the tanks ✓   ·   Hundred Days 1918: adapted too slow ✗</text>
<line x1="60" y1="790" x2="1540" y2="790" stroke="#e8eaef" stroke-width="1"/>
<text x="60" y="828" fill="#16a34a" font-size="12" letter-spacing="3" font-weight="700">DOCTRINE</text>
<text x="60" y="860" fill="#1a1d23" font-size="22" font-weight="500">The best defence is not the strongest wall. It is the deepest — and the one that keeps learning.</text>
