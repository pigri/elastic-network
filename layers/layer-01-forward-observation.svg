<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 730" font-family="'JetBrains Mono', ui-monospace, monospace">
  <style>text { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e8eaef" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="730" fill="#ffffff"/>
  <rect width="1600" height="730" fill="url(#grid)"/>

  <text x="60" y="56" fill="#8b92a5" font-size="16" letter-spacing="6" font-family="Orbitron, 'JetBrains Mono', monospace" font-weight="600">GEN0SEC · DOCTRINE</text>

  <rect x="60" y="100" width="80" height="80" rx="12" fill="#0891b2"/>
  <text x="100" y="158" fill="#ffffff" font-size="36" font-weight="700" text-anchor="middle">01</text>

  <text x="160" y="128" fill="#0891b2" font-size="15" letter-spacing="4" font-weight="600">LAYER 01 · OUTPOST LINE</text>
  <text x="160" y="168" fill="#1a1d23" font-size="36" font-weight="700" letter-spacing="-0.01em">Screen, see, warn.</text>

  <rect x="60" y="220" width="710" height="48" rx="6" fill="rgba(90,97,120,0.06)" stroke="#5a6178" stroke-width="1.2"/>
  <text x="415" y="251" fill="#1a1d23" font-size="18" font-weight="700" text-anchor="middle">MILITARY DOCTRINE</text>

  <rect x="830" y="220" width="710" height="48" rx="6" fill="rgba(0,111,255,0.06)" stroke="#006fff" stroke-width="1.2"/>
  <text x="1185" y="251" fill="#006fff" font-size="18" font-weight="700" text-anchor="middle">ELASTIC NETWORK DEFENSE</text>

  
  <rect x="60" y="290" width="710" height="250" rx="14" fill="rgba(8,145,178,0.08)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="88" y="340" fill="#1a1d23" font-size="22" font-weight="700">Outpost line</text>
  <text x="88" y="368" fill="#5a6178" font-size="16">Light recon, screening cavalry, listening posts. Far forward of</text>
  <text x="88" y="390" fill="#5a6178" font-size="16">the main line.</text>
  <text x="88" y="430" fill="#5a6178" font-size="16">Job: spot the attack early. Survive long enough to report. Slow</text>
  <text x="88" y="452" fill="#5a6178" font-size="16">them.</text>
  <text x="88" y="490" fill="#0891b2" font-size="14" font-style="italic">"Vorpostenlinie" · cavalry vedettes · LP/OP</text>
  
  <rect x="830" y="290" width="710" height="250" rx="14" fill="rgba(8,145,178,0.08)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="858" y="340" fill="#1a1d23" font-size="22" font-weight="700">External signal &amp; deception</text>
  <text x="858" y="368" fill="#5a6178" font-size="16">Dendrite captures every flow on the sensor. Threat intel feeds,</text>
  <text x="858" y="390" fill="#5a6178" font-size="16">honeypots, canary tokens, JA4+ telemetry.</text>
  <text x="858" y="430" fill="#5a6178" font-size="16">Job: see the attack before it touches your perimeter. Tip</text>
  <text x="858" y="452" fill="#5a6178" font-size="16">Cerebellum, which aggregates it into CTI.</text>
  <text x="858" y="490" fill="#0891b2" font-size="14" font-style="italic">Dendrite (capture) · Cerebellum CTI · honeynets · canaries · DNS sinkholes</text>

  <line x1="60" y1="590" x2="1540" y2="590" stroke="#e8eaef" stroke-width="1"/>
  <text x="60" y="630" fill="#0f172a" font-size="13" letter-spacing="3" font-weight="700">DOCTRINE</text>
  <text x="60" y="662" fill="#1a1d23" font-size="22" font-weight="500" letter-spacing="-0.01em">The point of the outpost is the warning, not the report.</text>
</svg>